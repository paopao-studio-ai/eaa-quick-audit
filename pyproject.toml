[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eaa-quick-audit"
version = "0.1.0"
description = "Free first-pass WCAG 2.1/2.2 AA scan for European Accessibility Act (EAA) readiness, with EN 301 549 mapping and EN/DE/FR reports."
readme = "README.md"
license = {text = "MIT (code); bundled axe-core is MPL-2.0"}
requires-python = ">=3.9"
dependencies = ["playwright>=1.40"]
keywords = ["accessibility", "wcag", "eaa", "european-accessibility-act", "en-301-549", "axe-core", "a11y"]

[project.scripts]
eaa-audit = "eaa_quick_audit.cli:main"

[tool.setuptools.package-data]
eaa_quick_audit = ["axe.min.js", "AXE_LICENSE.txt"]
